name: Frontend Automated Review

# CI-1 - also on main after each push (the checks, not the PR review), and a
# PR that only changes tests runs them too (test files are no longer excluded).
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/admin/**'
      - 'apps/portal/**'
      - 'packages/**'
      - '.github/workflows/frontend-review.yml'
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'apps/portal/**'
      - 'packages/**'
      - '.github/workflows/frontend-review.yml'
      - '!**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  frontend-review:
    name: Review Frontend Changes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # CI-1 - same major as the Docker images and Migration Integrity;
          # puppeteer and node-cron already require Node >= 22.12 / >= 20.
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run portal tests
        # Blocking on purpose: unlike the advisory steps below, a failing test
        # means a known regression (read-only rules, upload limits, banners...).
        run: npm run test --workspace=apps/portal

      - name: Run admin tests
        # Blocking too (Batch K1): first admin suite - files helpers, settings
        # UI rules, preliminary helpers, R3 priority badge.
        run: npm run test --workspace=apps/admin

      - name: Run typecheck
        # Blocking since CI-1 (api, admin, portal, shared at 0 errors).
        run: npm run typecheck

      - name: Run lint
        # Blocking since Batch K1: api, admin and portal are at 0 errors
        # (warnings do not fail the step).
        run: npm run lint

      - name: Build affected packages
        # Blocking since CI-1.
        run: npm run build

      - name: Get PR diff
        if: github.event_name == 'pull_request'
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff
          echo "diff_size=$(wc -l < /tmp/pr.diff)" >> $GITHUB_OUTPUT
          echo "diff_path=/tmp/pr.diff" >> $GITHUB_OUTPUT

      - name: Extract changed files
        if: github.event_name == 'pull_request'
        id: files
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > /tmp/changed-files.txt
          echo "files_list=$(cat /tmp/changed-files.txt | tr '\n' ',' | sed 's/,$//')" >> $GITHUB_OUTPUT

      - name: Run Frontend Review Agent
        id: review
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          CHANGED_FILES: ${{ steps.files.outputs.files_list }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Import the review agent module
            const ReviewAgent = require('./.github/scripts/frontend-review-agent.js');
            
            const reviewAgent = new ReviewAgent({
              github,
              context,
              prNumber: process.env.PR_NUMBER,
              baseRef: process.env.BASE_REF,
              headRef: process.env.HEAD_REF,
              changedFiles: process.env.CHANGED_FILES.split(',').filter(f => f)
            });
            
            const report = await reviewAgent.review();
            
            // CI-1 - the comment step reads the report from this output (it was
            // never set, so the comment was always empty).
            core.setOutput('review_report', JSON.stringify(report));
            core.setOutput('verdict', report.verdict);
            core.setOutput('blocking_issues', JSON.stringify(report.blockingIssues));
            core.setOutput('has_blocking', report.blockingIssues.length > 0 ? 'true' : 'false');
            
            return report;

      - name: Comment PR with Review Report
        # CI-1 - only when the review ran; the report goes through an env var
        # (pasting it into the script text broke on any quote it contained).
        if: always() && github.event_name == 'pull_request' && steps.review.outputs.review_report != ''
        uses: actions/github-script@v7
        env:
          REVIEW_REPORT: ${{ steps.review.outputs.review_report }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ReviewReport = require('./.github/scripts/review-report-formatter.js');

            const report = JSON.parse(process.env.REVIEW_REPORT || '{}');
            const formatter = new ReviewReport();
            const comment = formatter.formatAsMarkdown(report);
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Set PR status
        if: always() && github.event_name == 'pull_request' && steps.review.outputs.verdict != ''
        uses: actions/github-script@v7
        env:
          HAS_BLOCKING: ${{ steps.review.outputs.has_blocking }}
          VERDICT: ${{ steps.review.outputs.verdict }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const hasBlocking = process.env.HAS_BLOCKING === 'true';
            const verdict = process.env.VERDICT;
            
            let state = 'success';
            let description = `Frontend review completed: ${verdict}`;
            
            if (hasBlocking) {
              state = 'failure';
              description = 'Frontend review: BLOCKING issues found';
            } else if (verdict === 'APPROVE WITH FOLLOW-UP') {
              state = 'success';
              description = 'Frontend review: Approved with follow-up items';
            }
            
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state,
              context: 'Frontend Review',
              description
            });
